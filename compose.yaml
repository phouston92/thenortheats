services:
  postgres:
    image: postgres:17.7-alpine
    environment:
      POSTGRES_USER: north
      POSTGRES_PASSWORD: north_dev_only
      POSTGRES_DB: north_dev
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U north -d north_dev"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.4.7-alpine
    ports: ["127.0.0.1:6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres_data:
  redis_data:
